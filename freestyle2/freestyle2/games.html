        const gamesGrid = document.getElementById('gamesGrid');

        function renderGames(gamesToRender) {
            gamesGrid.innerHTML = '';
            if (gamesToRender.length === 0) {
                gamesGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">No games found matching your search.</p>';
                return;
            }
            gamesToRender.forEach(game => {
                const card = document.createElement('a');
                card.href = game.url;
                card.target = "_blank"; // Opens in a new tab so users don't lose your site
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-icon">🎮</div>
                    <h3>${game.name}</h3>
                    <p>Play on CrazyGames</p>
                `;
                gamesGrid.appendChild(card);
            });
        }

        function filterGames() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = games.filter(game => game.name.toLowerCase().includes(searchTerm));
            renderGames(filtered);
        }

        // Initial render of all games
        renderGames(games);
    </script>
