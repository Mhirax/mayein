        const gamesGrid = document.getElementById('gamesGrid');

        function renderGames(gamesToRender) {
            gamesGrid.innerHTML = '';
            if (gamesToRender.length === 0) {
                gamesGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">No games found matching your search.</p>';
                return;
            }
            gamesToRender.forEach(game => {
                const card = document.createElement('a');
                card.href = game.url;
                card.target = "_blank";
                card.className = 'game-card';
                
                const imageUrl = game.image || `https://placehold.co/400x250/1a1a2e/00d4ff?text=${encodeURIComponent(game.name)}&font=montserrat`;
                
                card.innerHTML = `
                    <img src="${imageUrl}" alt="${game.name} thumbnail" class="game-image" onerror="this.src='https://placehold.co/400x250/1a1a2e/00d4ff?text=${encodeURIComponent(game.name)}&font=montserrat'">
                    <h3>${game.name}</h3>
                    <p>Play on CrazyGames</p>
                `;
                gamesGrid.appendChild(card);
            });
        }

        function filterGames() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = games.filter(game => game.name.toLowerCase().includes(searchTerm));
            renderGames(filtered);
        }
